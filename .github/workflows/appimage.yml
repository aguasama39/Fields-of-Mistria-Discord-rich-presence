name: AppImage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc curl pkg-config python3 python3-gi \
            gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-dev libadwaita-1-dev \
            python3-pip
      - name: Run tests
        run: python3 -m pip install --user 'pytest>=8' && PYTHONPATH=src pytest
      - name: Build AppImage
        run: ./packaging/build-appimage.sh
      - name: Smoke-test bundled Python runtime
        run: ./packaging/test-appimage-runtime.sh dist/*.AppImage
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: mistria-presence-appimage
          path: dist/*.AppImage
